<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetroGames</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>RetroGames</h1>
        <p>Encontre seu próximo jogo!!</p>
    </header>

    <main class="container">
        <div class="titulo-secao">
            <div>
                <h2>Nossos Jogos</h2>
                <p>Escolha um jogo</p>
            </div>
            <button id="btnCadastrar" type="button">+ Cadastrar Jogo</button>
        </div>

        <section id="listarJogos" class="listar-jogos">
            <p id="mensagemVazia">Nenhum jogo cadastrado</p>
        </section>
    </main>

    <dialog id="modalCadastro">
        <h2>Novo jogo</h2>
        <form id="formJogo">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" required>

            <label for="plataforma">Plataforma</label>
            <input type="text" id="plataforma" placeholder="SNES, Mega Drive, PS1..." required>

            <label for="desenvolvedora">Desenvolvedora</label>
            <input type="text" id="desenvolvedora" required>

            <label for="imagem">URL da imagem da capa</label>
            <input type="url" id="imagem" placeholder="https://site.com/capa.jpg" required>

            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" min="0.01" step="0.01" required>

            <div class="acoes">
                <button type="button" id="btnCancelar" class="cancelar">Cancelar</button>
                <button type="submit">Salvar jogo</button>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
